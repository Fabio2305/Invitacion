<style>
/* Layout: un libro ilustrado hecho a mano sobre una noche cálida. En vertical, una hoja; en un iPad horizontal, el libro abierto a doble página. Las hojas se pasan arrastrando con el dedo. Tema nocturno fijo, a propósito. */
:root {
  --night: #17121f;
  --night-2: #241b30;
  --muted: #b9a7b4;
  --rose: #e8a0a8;
  --rose-deep: #c96b7b;
  --glow: rgba(232, 160, 168, 0.16);
  --paper: #f8eeea;
  --paper-2: #f3e5df;
  --paper-edge: #e3d0c9;
  --ink: #3b2536;
  --ink-soft: #7a5e6f;
  --accent: #b8566a;
  --leather: #4b2340;
  --leather-2: #2c1126;
  --foil-1: #f6d6c9;
  --foil-2: #c9927f;
  --satin: #a63f55;
  --font-display: "Fraunces", "Georgia", serif;
  --font-body: "Newsreader", "Georgia", serif;
  --font-hand: "Caveat", "Segoe Script", cursive;
  --pw: 360px;
  --ph: 560px;
  color-scheme: dark;
}
html, body { height: 100%; }
#app { height: 100%; height: 100dvh; }
body {
  background: var(--night);
  color: var(--ink);
  font-family: var(--font-body);
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  -webkit-user-select: none;
}
.stage {
  position: relative;
  box-sizing: border-box;
  height: 100%;
  min-height: 480px;
  background:
    radial-gradient(ellipse 70% 55% at 50% 42%, var(--glow), transparent 70%),
    radial-gradient(ellipse 120% 80% at 50% 120%, var(--night-2), transparent 60%),
    var(--night);
}
canvas#fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 40; }

.area {
  position: absolute;
  top: calc(22px + env(safe-area-inset-top, 0px));
  bottom: calc(136px + env(safe-area-inset-bottom, 0px));
  left: max(14px, env(safe-area-inset-left, 0px));
  right: max(14px, env(safe-area-inset-right, 0px));
  display: grid; place-items: center;
  touch-action: none;
}

/* ---------- Libro ---------- */
.book {
  position: relative;
  width: var(--pw); height: var(--ph);
  perspective: 2600px;
  transition: transform 1000ms cubic-bezier(.645,.045,.355,1);
}
.book.spread { width: calc(var(--pw) * 2); }
.book.spread.closed { transform: translateX(calc(var(--pw) * -0.5)); }
.book.dragging { transition: none; }

.stack { position: absolute; top: 0; height: 100%; width: var(--pw); background: var(--paper-edge); border-radius: 4px 10px 10px 4px; z-index: 0; }
.stack.r { left: 0; }
.book.spread .stack.r { left: var(--pw); border-radius: 0 10px 10px 0; }
.stack.l { left: 0; border-radius: 10px 0 0 10px; display: none; }
.book.spread .stack.l { display: block; }

.ribbon {
  position: absolute; z-index: 1; top: -4px; right: 12%;
  width: clamp(12px, 3.4%, 18px); height: calc(100% + 44px);
  background: linear-gradient(90deg, #7e2a3f, var(--satin) 35%, #c65c72 50%, var(--satin) 65%, #7e2a3f);
  clip-path: polygon(0 0, 100% 0, 100% 100%, 50% calc(100% - 12px), 0 100%);
  -webkit-clip-path: polygon(0 0, 100% 0, 100% 100%, 50% calc(100% - 12px), 0 100%);
  transform-origin: 50% 0;
  animation: sway 5s ease-in-out infinite;
}
.book.spread .ribbon { right: 7%; }
@keyframes sway { 0%,100% { transform: rotate(-1.2deg); } 50% { transform: rotate(1.4deg); } }

.sheet {
  position: absolute; top: 0; left: 0; width: var(--pw); height: 100%;
  transform-origin: 0 50%;
  transform-style: preserve-3d;
  -webkit-transform-style: preserve-3d;
  --p: 0;
}
.book.spread .sheet { left: var(--pw); }
.sheet.off { visibility: hidden; }

.face {
  position: absolute; inset: 0;
  box-sizing: border-box;
  overflow: hidden;
  container-type: size;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  border-radius: 4px 10px 10px 4px;
  background:
    var(--noise, none),
    linear-gradient(to right, rgba(59,37,54,.16), rgba(59,37,54,0) 6%),
    radial-gradient(ellipse at 72% 18%, rgba(255,255,255,.55), transparent 60%),
    var(--paper);
  box-shadow: 0 26px 50px rgba(0,0,0,.4);
}
.face.back { transform: rotateY(180deg); background: var(--noise, none), linear-gradient(to left, rgba(59,37,54,.14), rgba(59,37,54,0) 6%), var(--paper-2); border-radius: 10px 4px 4px 10px; }
.book.spread .face { border-radius: 0 10px 10px 0; background: var(--noise, none), linear-gradient(to right, rgba(59,37,54,.22), rgba(59,37,54,.05) 5%, rgba(59,37,54,0) 10%), radial-gradient(ellipse at 72% 18%, rgba(255,255,255,.55), transparent 60%), var(--paper); }
.book.spread .face.back { border-radius: 10px 0 0 10px; background: var(--noise, none), linear-gradient(to left, rgba(59,37,54,.22), rgba(59,37,54,.05) 5%, rgba(59,37,54,0) 10%), radial-gradient(ellipse at 30% 18%, rgba(255,255,255,.5), transparent 60%), var(--paper); }
.shade { position: absolute; inset: 0; pointer-events: none; z-index: 5; }
.face.front .shade { background: linear-gradient(to left, rgba(30,15,25,.55), rgba(30,15,25,.1) 60%, transparent); opacity: calc(var(--p) * 1.1); }
.face.back .shade { background: linear-gradient(to right, rgba(30,15,25,.5), rgba(30,15,25,.08) 60%, transparent); opacity: calc((1 - var(--p)) * 1.1); }
/* En una sola hoja (iPhone, iPad vertical) no hay página izquierda: la hoja que se pasa
   se desvanece mientras gira, en vez de quedarse a un lado y desaparecer de golpe. */
.book:not(.spread) .face.back { opacity: clamp(0, calc((1 - var(--p)) * 2.4), 1); }
.book:not(.spread) .sheet { transform-origin: 0 50%; }

.inner {
  position: relative; z-index: 1;
  box-sizing: border-box; height: 100%;
  display: grid; align-content: center; justify-items: stretch;
  gap: calc(clamp(.8rem, 3.2cqi, 1.6rem) * var(--fit, 1));
  padding: clamp(26px, 9cqi, 70px) clamp(24px, 9cqi, 66px);
}
.line {
  margin: 0;
  font-size: calc(clamp(1.02rem, .45rem + 3.1cqi, 1.85rem) * var(--fit, 1));
  line-height: 1.7;
  color: var(--ink);
  opacity: 0;
  text-wrap: pretty;
  -webkit-font-smoothing: antialiased;
}
.line.shown { opacity: 1; }
.line.greet { font-family: var(--font-hand); font-weight: 600; color: var(--accent); font-size: calc(clamp(1.9rem, .8rem + 6.2cqi, 3.6rem) * var(--fit, 1)); line-height: 1.15; }
.line em { font-style: italic; color: var(--accent); }

/* Dibujos con acuarela */
.art-wrap { position: relative; justify-self: center; display: grid; place-items: center; }
.wash { position: absolute; inset: -22%; background-size: 100% 100%; opacity: .9; pointer-events: none; }
.art { position: relative; width: calc(clamp(72px, 24cqi, 160px) * var(--fit, 1)); color: var(--accent); }
.art svg { display: block; width: 100%; height: auto; overflow: visible; }
.art path { fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1; stroke-dashoffset: 1; transition: stroke-dashoffset 2200ms cubic-bezier(.45,.05,.3,1); }
.art .dot, .art .art-text { fill: currentColor; opacity: 0; transition: opacity 900ms ease 1500ms; }
.art .art-text { font-family: var(--font-hand); font-size: 20px; font-weight: 600; stroke: none; }
.art.drawn path { stroke-dashoffset: 0; }
.art.drawn .dot, .art.drawn .art-text { opacity: 1; }
.artface .inner { justify-items: center; }
.artface .art { width: 56cqi; }
.artface .wash { inset: -30%; }

/* Vida de cada dibujo mientras ella lee (empieza cuando termina de trazarse) */
.art g { transform-box: fill-box; transform-origin: center; }
.art .d1 { --d: .3s; } .art .d2 { --d: .6s; } .art .d3 { --d: .9s; } .art .d4 { --d: 1.2s; }
.art .d5 { --d: 1.5s; } .art .d6 { --d: 1.8s; } .art .d7 { --d: 2.1s; }
.live .art.drawn g { animation-delay: calc(2.3s + var(--d, 0s)); animation-iteration-count: infinite; animation-timing-function: ease-in-out; }
.live .art.drawn .a-beat { animation-name: beat; animation-duration: 1.8s; }
.live .art.drawn .a-twinkle { animation-name: twinkle; animation-duration: 2.6s; }
.live .art.drawn .a-pulse { animation-name: pulse-s; animation-duration: 1.4s; animation-direction: alternate; }
.live .art.drawn .a-sway { animation-name: sway; animation-duration: 3.2s; animation-direction: alternate; }
.art .a-sway, .art .a-flicker { transform-origin: 50% 100%; }
.live .art.drawn .a-float { animation-name: float; animation-duration: 3.4s; animation-direction: alternate; }
.live .art.drawn .a-flip { animation-name: flip; animation-duration: 7s; animation-timing-function: cubic-bezier(.65,0,.35,1); }
.live .art.drawn .a-flicker { animation-name: flicker; animation-duration: 1.3s; }
.live .art.drawn .a-glow { animation-name: glow; animation-duration: 1.6s; animation-direction: alternate; }
.live .art.drawn .a-rays { animation-name: rays; animation-duration: 1.8s; }
.live .art.drawn .a-sun { animation-name: sun; animation-duration: 4s; animation-direction: alternate; }
.live .art.drawn .a-drift { animation-name: drift; animation-duration: 9s; animation-timing-function: linear; }
.live .art.drawn .a-smoke { animation-name: smoke; animation-duration: 3s; animation-timing-function: ease-out; }
.live .art.drawn .a-left { animation-name: to-right; animation-duration: 2.2s; animation-direction: alternate; }
.live .art.drawn .a-right { animation-name: to-left; animation-duration: 2.2s; animation-direction: alternate; }
.live .art.drawn .a-hop { animation-name: hop; animation-duration: 2.6s; }
.live .art.drawn .a-rise { animation-name: rise; animation-duration: 3.2s; }
.live .art.drawn .a-cloud { animation-name: cloud; animation-duration: 5s; animation-direction: alternate; }
.live .art.drawn .a-step { animation-name: step; animation-duration: 3s; }
@keyframes beat { 0%,100% { transform: scale(1); } 14% { transform: scale(1.09); } 28% { transform: scale(1); } 42% { transform: scale(1.06); } 60% { transform: scale(1); } }
@keyframes twinkle { 0%,100% { opacity: 1; transform: scale(1) rotate(0deg); } 50% { opacity: .2; transform: scale(.5) rotate(45deg); } }
@keyframes pulse-s { from { transform: scale(1); } to { transform: scale(1.22); } }
@keyframes sway { from { transform: rotate(-5deg); } to { transform: rotate(5deg); } }
@keyframes float { from { transform: translateY(2px); } to { transform: translateY(-5px); } }
@keyframes flip { 0%,40% { transform: rotate(0deg); } 50%,90% { transform: rotate(180deg); } 100% { transform: rotate(360deg); } }
@keyframes flicker { 0%,100% { transform: scale(1,1) skewX(0); } 25% { transform: scale(.94,1.08) skewX(-3deg); } 50% { transform: scale(1.04,.95) skewX(2deg); } 75% { transform: scale(.97,1.05) skewX(-1deg); } }
@keyframes glow { from { opacity: .35; } to { opacity: 1; } }
@keyframes rays { 0%,100% { transform: scale(.92); opacity: .5; } 20% { transform: scale(1.1); opacity: 1; } }
@keyframes sun { from { transform: translateY(1px) scale(.95); } to { transform: translateY(-3px) scale(1.1); } }
@keyframes drift { 0% { transform: translate(-10px, 4px); opacity: 0; } 15% { opacity: 1; } 85% { opacity: 1; } 100% { transform: translate(70px, -6px); opacity: 0; } }
@keyframes smoke { 0% { transform: translate(0, 6px) scale(.6); opacity: 0; } 30% { opacity: 1; } 100% { transform: translate(4px, -8px) scale(1.3); opacity: 0; } }
@keyframes to-right { from { transform: translateX(-2px); } to { transform: translateX(4px); } }
@keyframes to-left { from { transform: translateX(2px); } to { transform: translateX(-4px); } }
@keyframes hop { 0%,40%,100% { transform: translateY(0); } 10% { transform: translateY(-5px) rotate(-4deg); } 20% { transform: translateY(0); } 28% { transform: translateY(-3px); } }
@keyframes rise { 0% { transform: translateY(6px) scale(.7); opacity: 0; } 25% { opacity: 1; } 100% { transform: translateY(-14px) scale(1.1); opacity: 0; } }
@keyframes cloud { from { transform: translateX(-4px); } to { transform: translateX(6px); } }
@keyframes step { 0%,100% { opacity: .25; } 20% { opacity: 1; } 50% { opacity: .5; } }



/* Corazoncitos que suben despacio por el fondo de la hoja */
.ambient { position: absolute; inset: 0; overflow: hidden; pointer-events: none; z-index: 0; }
.ambient i { position: absolute; bottom: -30px; font-style: normal; color: var(--accent); opacity: 0; animation: amb linear infinite; animation-play-state: paused; }
.live .ambient i { animation-play-state: running; }
@keyframes amb { 0% { transform: translate(0, 0) rotate(-10deg); opacity: 0; } 10% { opacity: .28; } 50% { transform: translate(var(--sway), -55cqh) rotate(10deg); } 85% { opacity: .22; } 100% { transform: translate(0, -110cqh) rotate(-6deg); opacity: 0; } }

/* ---------- Portada ---------- */
.cover {
  background:
    radial-gradient(ellipse at 30% 18%, rgba(255,255,255,.13), transparent 55%),
    linear-gradient(to right, rgba(0,0,0,.4), rgba(0,0,0,0) 5%, rgba(255,255,255,.06) 6%, rgba(0,0,0,0) 8%),
    var(--noise, none),
    linear-gradient(160deg, var(--leather), var(--leather-2)) !important;
  border-radius: 4px 12px 12px 4px !important;
  box-shadow: 0 30px 60px rgba(0,0,0,.55) !important;
}
.cover .frame { position: absolute; inset: 5% 5% 5% 9%; border: 1px solid rgba(246,214,201,.4); border-radius: 6px; pointer-events: none; }
.cover .frame::before { content: ""; position: absolute; inset: 7px; border: 1px solid rgba(246,214,201,.18); border-radius: 4px; }
.cover .inner { justify-items: center; text-align: center; gap: calc(clamp(.6rem, 2.6cqi, 1.3rem)); padding-left: 16cqi; padding-right: 22cqi; }
.cover .kicker { max-width: 14em; line-height: 1.6; }
.foil {
  background: linear-gradient(100deg, var(--foil-2) 0%, var(--foil-1) 30%, #fff3ec 42%, var(--foil-1) 55%, var(--foil-2) 100%);
  background-size: 260% 100%;
  -webkit-background-clip: text; background-clip: text;
  color: transparent; -webkit-text-fill-color: transparent;
  animation: shine 6s ease-in-out infinite;
}
@keyframes shine { 0%,100% { background-position: 100% 0; } 50% { background-position: 0% 0; } }
.cover .kicker { font-size: clamp(.72rem, .3rem + 2.4cqi, 1.25rem); letter-spacing: .3em; text-transform: uppercase; }
.cover .title { margin: 0; font-family: var(--font-hand); font-weight: 700; font-size: clamp(3rem, 1rem + 14cqi, 7rem); line-height: 1.05; padding: 0 .1em; }
.cover .seal {
  width: clamp(64px, 18cqi, 116px); aspect-ratio: 1; border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #e48a98, var(--rose-deep) 60%, #8f3f50);
  display: grid; place-items: center;
  box-shadow: 0 0 0 6px rgba(201,107,123,.14), 0 10px 30px rgba(0,0,0,.35);
}
.cover .seal svg { width: 44%; fill: #fbeee9; opacity: .92; }
.cover .tap { font-size: clamp(.7rem, .35rem + 1.8cqi, 1.05rem); letter-spacing: .22em; text-transform: uppercase; color: var(--foil-1); opacity: .65; animation: breathe 2.4s ease-in-out infinite; }
@keyframes breathe { 0%,100% { opacity: .35; } 50% { opacity: .85; } }
.song {
  display: inline-grid; place-items: center; width: 44px; height: 44px; border-radius: 50%;
  border: 1px solid rgba(246,214,201,.4); color: var(--foil-1); text-decoration: none; opacity: .85;
  font-size: 1.25rem; line-height: 1;
}
.song span { animation: note 2.4s ease-in-out infinite; }
@keyframes note { 0%,100% { transform: rotate(0) scale(1); } 25% { transform: rotate(-10deg) scale(1.06); } 75% { transform: rotate(10deg) scale(1.06); } }
.song:focus-visible { outline: 1px solid var(--foil-1); outline-offset: 3px; }

/* Lazo de la portada */
.tie { position: absolute; z-index: 3; right: 10%; width: clamp(16px, 5.5cqi, 30px); background: linear-gradient(90deg, #7e2a3f, var(--satin) 30%, #d0687e 50%, var(--satin) 70%, #7e2a3f); box-shadow: 0 0 8px rgba(0,0,0,.35); }
.tie.t { top: 0; height: 50%; }
.tie.b { bottom: 0; height: 50%; }
.bow {
  position: absolute; z-index: 4; top: 50%; right: 10%;
  width: clamp(84px, 26cqi, 150px); aspect-ratio: 1.3;
  transform: translate(calc(50% - clamp(8px, 2.75cqi, 15px)), -50%);
  border: 0; padding: 0; background: none; cursor: pointer;
  filter: drop-shadow(0 6px 8px rgba(0,0,0,.4));
}
.bow svg { width: 100%; height: 100%; display: block; }
.bow:focus-visible { outline: 2px solid var(--foil-1); outline-offset: 4px; border-radius: 12px; }
.bow.wiggle svg { animation: bowwig 3s ease-in-out infinite; transform-origin: 50% 45%; }
@keyframes bowwig { 0%,80%,100% { transform: rotate(0); } 86% { transform: rotate(-6deg); } 92% { transform: rotate(5deg); } }

/* ---------- Pregunta, pop-up y respuesta ---------- */
.qface .inner { justify-items: center; text-align: center; }
.lead { margin: 0; font-size: calc(clamp(1rem, .5rem + 2.6cqi, 1.6rem) * var(--fit, 1)); color: var(--ink-soft); line-height: 1.6; max-width: 30rem; }
.q { margin: 0; font-family: var(--font-display); font-weight: 300; font-style: italic; font-size: calc(clamp(2rem, .8rem + 7cqi, 4.2rem) * var(--fit, 1)); line-height: 1.1; color: var(--ink); text-wrap: balance; }
.choices { display: flex; gap: .9rem; flex-wrap: wrap; justify-content: center; align-items: center; min-height: 4.6rem; }
.choice {
  font-family: var(--font-display); font-size: calc(clamp(1.15rem, .8rem + 1.6cqi, 1.5rem) * var(--fit, 1));
  padding: .6em 1.9em; border-radius: 999px; cursor: pointer;
  border: 1px solid var(--accent); background: transparent; color: var(--ink);
  transition: font-size 450ms cubic-bezier(.34,1.56,.64,1), transform 200ms ease, opacity 300ms ease;
}
.choice.yes { background: var(--accent); color: #fff7f5; white-space: nowrap; box-shadow: 0 8px 26px rgba(168,72,90,.35); }
.choice.no { position: relative; z-index: 6; max-width: 16rem; transition: opacity 300ms ease, left 450ms cubic-bezier(.34,1.56,.64,1), top 450ms cubic-bezier(.34,1.56,.64,1); }
.choice.no.loose { position: absolute; max-width: none; white-space: nowrap; margin: 0; }
.choice:hover, .choice:focus-visible { transform: translateY(-2px); }
.choice:focus-visible { outline: 2px solid var(--ink); outline-offset: 4px; }
.choice.wiggle { animation: wiggle 500ms ease; }
@keyframes wiggle { 0%,100% { transform: rotate(0); } 25% { transform: rotate(-4deg) scale(1.03); } 75% { transform: rotate(4deg) scale(1.03); } }

.popup { position: relative; justify-self: center; width: calc(clamp(90px, 30cqi, 190px) * var(--fit, 1)); aspect-ratio: 1.1; }
.popface .popup { width: 62cqi; }
.popface .inner { justify-items: center; text-align: center; }
.popface .hand { font-family: var(--font-hand); font-weight: 600; color: var(--accent); font-size: clamp(1.6rem, .8rem + 5cqi, 3rem); opacity: 0; }
.pop-stage { position: absolute; inset: 0; transform-origin: 50% 100%; transform: scaleY(.04); }
.pop-half { position: absolute; inset: 0; }
.pop-half svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.pop-half.l { clip-path: inset(-10% 50% -10% -10%); -webkit-clip-path: inset(-10% 50% -10% -10%); transform-origin: 50% 50%; transform: scaleX(0); }
.pop-half.r { clip-path: inset(-10% -10% -10% 50%); -webkit-clip-path: inset(-10% -10% -10% 50%); transform-origin: 50% 50%; transform: scaleX(0); }
.pop-shadow { position: absolute; left: 12%; right: 12%; bottom: -6%; height: 12%; border-radius: 50%; background: radial-gradient(closest-side, rgba(59,37,54,.35), transparent); opacity: 0; }

.answer { display: grid; justify-items: center; gap: calc(.6rem * var(--fit, 1)); }
.answer .big { font-family: var(--font-hand); font-weight: 600; color: var(--accent); font-size: calc(clamp(2.4rem, 1rem + 8cqi, 5rem) * var(--fit, 1)); line-height: 1.05; text-wrap: balance; }

.hint {

const WASH_COLORS = [[232,160,168], [244,196,170], [214,170,214], [246,206,190], [226,150,170]];
const washCache = [];
function washURL(k) {
  if (washCache[k]) return washCache[k];

  const r = () => { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };

    const cx = 70 + r() * 120, cy = 70 + r() * 120, rad = 60 + r() * 60;

const POP_SVG = '<svg viewBox="0 0 200 180"><defs><linearGradient id="popg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#e48a98"/><stop offset="1" stop-color="#a63f55"/></linearGradient></defs>' +
  '<path d="M100 172 C40 132 8 100 8 62 C8 32 30 12 56 12 C76 12 90 24 100 40 C110 24 124 12 144 12 C170 12 192 32 192 62 C192 100 160 132 100 172 Z" fill="url(#popg)"/>' +

const popFace = () => '<div class="inner">' + popupHTML() + '<div class="hand">para ti</div></div>';

const questionFace = (withPopup) =>
  '<div class="inner">' + (withPopup ? popupHTML() : '') +
    '<div class="ask" style="display:grid;gap:inherit;justify-items:center">' +
      '<p class="lead">Por eso, para dar el primer paso hacia una vida juntitos, quiero preguntarte algo.</p>' +

    '</div>' +
    '<div class="answer" id="answer" hidden>' +
      '<div class="big">Por una vida juntos</div>' +

      '<button class="again" id="again" type="button" aria-label="Volver a leer" title="Volver a leer"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5V2L7.5 6.5 12 11V7.5a5.5 5.5 0 1 1-5.5 5.5H4a8 8 0 1 0 8-8z"/></svg></button>' +

// ===== Estado =====
let spread = false, sheets = [], idx = 0, busy = false, answered = false, tied = true;
let timers = [], revealing = false;
const N = LETTER.length;           // hojas de carta
const Q = N + 1;                   // índice de la hoja de la pregunta (0 es la portada)

function makeSheet(front, back, extra) {
  const s = document.createElement("div");
  s.className = "sheet";
  s.innerHTML = '<div class="face front ' + (extra || "") + '"><div class="shade"></div>' + front + '</div><div class="face back"><div class="shade"></div>' + back + '</div>';
  book.appendChild(s);
  return s;
}

function build() {
  sheets.forEach(s => s.remove());
  sheets = [];
  book.classList.toggle("spread", spread);
  // portada
  const cov = makeSheet(coverFace(), spread ? artFace(0) : blankFace());
  cov.querySelector(".face.front").classList.add("cover");
  if (spread) cov.querySelector(".face.back").classList.add("artface");
  sheets.push(cov);
  // carta
  for (let k = 0; k < N; k++) {
    let s;
    if (spread) {
      s = makeSheet(textFace(k), k < N - 1 ? artFace(k + 1) : popFace());
      s.querySelector(".face.back").classList.add(k < N - 1 ? "artface" : "popface");
    } else {
      s = makeSheet(comboFace(k), blankFace());
    }
    s.dataset.k = k;
    s.querySelector(".face.front").classList.add("letter");
    sheets.push(s);
  }
  // pregunta
  const q = makeSheet(questionFace(!spread), blankFace());
  q.querySelector(".face.front").classList.add("qface");
  sheets.push(q);

  book.querySelectorAll(".art svg path").forEach(p => p.setAttribute("pathLength", "1"));
  if (!tied) { ["tieT", "tieB", "bow"].forEach(id => { const el = $(id); if (el) el.style.display = "none"; }); }
  wireSheetControls();
  fitAll();
  sheets.forEach((s, i) => setAngle(s, i < idx ? -180 : 0));
  arrange();
  onLand(false);
}

function setAngle(s, a) {
  s.style.transform = "rotateY(" + a.toFixed(2) + "deg)";
  s.style.setProperty("--p", (Math.min(1, Math.max(0, -a / 180))).toFixed(3));
}

// orden en z y qué hojas se dibujan
function arrange(extraVisible) {
  sheets.forEach((s, i) => {
    s.style.zIndex = i < idx ? 10 + i : 200 - i;
    let vis = i === idx || i === idx + 1 || (spread && (i === idx - 1 || i === idx - 2));
    if (extraVisible && extraVisible.includes(i)) vis = true;
    s.classList.toggle("off", !vis);
  });
  book.classList.toggle("closed", idx === 0);
  // grosor de las hojas a cada lado
  const right = Math.max(0, sheets.length - idx - 1), left = Math.max(0, idx - 1);
  $("stackR").style.boxShadow = layers(right, 1);
  $("stackL").style.boxShadow = layers(left, -1);
  $("stackL").style.visibility = spread && idx > 0 ? "visible" : "hidden";
}
function layers(n, dir) {
  const count = Math.min(7, Math.ceil(n / 2));
  const out = [];
  for (let j = 1; j <= count; j++) out.push((dir * j * 1.6).toFixed(1) + "px " + (j * 1.1).toFixed(1) + "px 0 -" + (j * .4).toFixed(1) + "px " + (j % 2 ? "#e6d3cd" : "#d6c0b9"));
  out.push("0 30px 60px rgba(0,0,0,.45)");
  return out.join(",");
}

// ===== Tamaño del libro según la pantalla =====
function layout() {
  const r = area.getBoundingClientRect();
  const W = r.width, H = r.height;
  const wantSpread = W > H * 1.15 && W >= 860 && H >= 480;
  let pw, ph;
  if (wantSpread) {
    ph = Math.min(H, 860); pw = ph * .72;
    if (pw * 2 > W) { pw = W / 2; ph = pw / .72; }
  } else {
    pw = Math.min(W, 680); ph = Math.min(H, pw / .6);
    if (pw > ph * .8) pw = ph * .8;
  }
  document.documentElement.style.setProperty("--pw", Math.floor(pw) + "px");
  document.documentElement.style.setProperty("--ph", Math.floor(ph) + "px");
  if (wantSpread !== spread || !sheets.length) { spread = wantSpread; build(); }
  else fitAll();
}

// Si una hoja no cabe, se reduce un poco la letra solo en esa hoja.
function fitAll() {
  book.querySelectorAll(".face").forEach(f => {
    const inner = f.querySelector(".inner");
    if (!inner) return;
    const off = f.parentElement.classList.contains("off");
    if (off) f.parentElement.classList.remove("off");
    let v = 1;
    inner.style.setProperty("--fit", v);
    while (inner.scrollHeight > f.clientHeight + 1 && v > .6) { v -= .04; inner.style.setProperty("--fit", v.toFixed(2)); }
    if (off) f.parentElement.classList.add("off");
  });
}

// ===== Al llegar a una hoja: dibujos, frases, pop-up =====
function visibleFaces() {
  const right = sheets[idx] ? sheets[idx].querySelector(".face.front") : null;
  const left = spread && idx > 0 ? sheets[idx - 1].querySelector(".face.back") : null;
  return { left, right };
}
function clearTimers() { timers.forEach(clearTimeout); timers = []; }

function animateLine(l) {
  l.classList.add("shown");
  if (!l.animate) return;
  l.animate(REDUCED ? [{ opacity: 0 }, { opacity: 1 }] : [{ opacity: 0, transform: "translateY(12px)" }, { opacity: .6, transform: "translateY(4px)", offset: .5 }, { opacity: 1, transform: "translateY(0)" }],
    { duration: 1300, easing: "cubic-bezier(.25,.6,.3,1)", fill: "backwards" });
}
function onLand(animated) {
  clearTimers();
  hideHint();
  book.querySelectorAll(".live").forEach(f => f.classList.remove("live"));
  const { left, right } = visibleFaces();
  [left, right].forEach(f => { if (!f) return; f.classList.add("live"); f.querySelectorAll(".art").forEach(a => timers.push(setTimeout(() => a.classList.add("drawn"), animated ? 200 : 0))); });
  if (left && left.classList.contains("popface")) popUp(left);
  if (right && right.classList.contains("qface") && !spread && !answered) popUp(right);
  if (right && right.classList.contains("letter")) {
    const lines = [...right.querySelectorAll(".line")];
    if (lines.every(l => l.classList.contains("shown"))) { revealing = false; timers.push(setTimeout(showHint, 900)); }
    else {
      revealing = true;
      lines.forEach((l, i) => timers.push(setTimeout(() => {
        animateLine(l);
        if (i === lines.length - 1) { revealing = false; timers.push(setTimeout(showHint, 1300)); }
      }, (animated ? 450 : 350) + i * 1500)));
    }
  } else revealing = false;
  updateChrome();
}
function showAllLines() {
  clearTimers();
  const { right } = visibleFaces();
  if (right) right.querySelectorAll(".line").forEach(l => { if (!l.classList.contains("shown")) { l.classList.add("shown"); } if (l.getAnimations) l.getAnimations().forEach(a => a.finish()); });
  revealing = false;
  showHint();
}
function showHint() { const { right } = visibleFaces(); if (!answered && right && right.classList.contains("letter")) $("hint").classList.add("on"); }
function hideHint() { $("hint").classList.remove("on"); }

function popUp(face) {
  const stage = face.querySelector(".pop-stage");
  if (!stage || face.dataset.popped) return;
  face.dataset.popped = "1";
  const L = face.querySelector(".pop-half.l"), R = face.querySelector(".pop-half.r"), sh = face.querySelector(".pop-shadow"), hand = face.querySelector(".hand");
  const o = { duration: REDUCED ? 400 : 1500, delay: 500, easing: "cubic-bezier(.3,1.35,.5,1)", fill: "forwards" };
  if (!stage.animate) { stage.style.transform = "none"; L.style.transform = R.style.transform = "none"; return; }
  // sube desde la página como un pop-up y se abre desde el centro
  stage.animate([{ transform: "scaleY(.04)" }, { transform: "scaleY(1.08)", offset: .6 }, { transform: "scaleY(.97)", offset: .8 }, { transform: "scaleY(1)" }], Object.assign({}, o, { easing: "ease-out" }));
  L.animate([{ transform: "scaleX(0) skewY(8deg)" }, { transform: "scaleX(.25) skewY(6deg)", offset: .35 }, { transform: "scaleX(1.04) skewY(0)", offset: .8 }, { transform: "scaleX(1)" }], Object.assign({}, o, { easing: "ease-out" }));
  R.animate([{ transform: "scaleX(0) skewY(-8deg)" }, { transform: "scaleX(.25) skewY(-6deg)", offset: .35 }, { transform: "scaleX(1.04) skewY(0)", offset: .8 }, { transform: "scaleX(1)" }], Object.assign({}, o, { easing: "ease-out" }));
  sh.animate([{ opacity: 0 }, { opacity: 1 }], o);
  if (hand) hand.animate([{ opacity: 0, transform: "translateY(10px)" }, { opacity: 1, transform: "none" }], { duration: 900, delay: 1600, fill: "forwards" });
}
function resetPopups() { book.querySelectorAll("[data-popped]").forEach(f => { delete f.dataset.popped; f.querySelectorAll(".pop-stage,.pop-half,.pop-shadow,.hand").forEach(e => e.getAnimations && e.getAnimations().forEach(a => a.cancel())); }); }

function updateChrome() {
  const nav = $("nav");
  nav.classList.toggle("hide", idx === 0 || answered);
  $("prev").disabled = idx === 0;
  $("next").disabled = idx >= Q;
  $("bar").style.width = (Math.max(0, idx - 1) / (Q - 1) * 100) + "%";
}

// ===== Pasar la hoja =====
const ease = (t) => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
function tween(from, to, dur, step) {
  return new Promise(res => {
    if (REDUCED) dur = Math.min(dur, 250);
    const t0 = performance.now();
    (function f(t) {
      const k = Math.min(1, (t - t0) / dur);
      step(from + (to - from) * ease(k));
      if (k < 1) requestAnimationFrame(f); else res();
    })(t0);
  });
}
function shiftFor(p) { return spread ? "translateX(" + (-(1 - p) * 0.5 * parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--pw"))) + "px)" : ""; }

// p: 0 = hoja en su lugar (derecha), 1 = hoja pasada (izquierda)
function driveSheet(i, p) {
  setAngle(sheets[i], -180 * p);
  if (i === 0 && spread) book.style.transform = shiftFor(p);
}

async function turnForward(fromP) {
  if (idx >= Q || answered) return;
  busy = true;
  const i = idx;
  if (i === 0 && tied) await untie();
  hideHint();
  clearTimers();
  playFlip();
  arrange([i, i + 1]);
  sheets[i].style.zIndex = 400;
  book.classList.add("dragging");
  await tween(fromP || 0, 1, 1050 * (1 - (fromP || 0)) + 250, (p) => driveSheet(i, p));
  book.classList.remove("dragging");
  book.style.transform = "";
  idx = i + 1;
  arrange();
  busy = false;
  onLand(true);
}
async function turnBack(fromP) {
  if (idx <= 0 || answered) return;
  busy = true;
  const i = idx - 1;
  hideHint();
  clearTimers();
  playFlip();
  arrange([i, i - 1]);
  sheets[i].style.zIndex = 400;
  book.classList.add("dragging");
  const start = fromP === undefined ? 1 : fromP;
  await tween(start, 0, 1050 * start + 250, (p) => driveSheet(i, p));
  book.classList.remove("dragging");
  book.style.transform = "";
  idx = i;
  arrange();
  busy = false;
  onLand(true);
}
async function settle(i, fromP, toP) {
  book.classList.add("dragging");
  await tween(fromP, toP, 400, (p) => driveSheet(i, p));
  book.classList.remove("dragging");
  book.style.transform = "";
  arrange();
  busy = false;
  if (!revealing) showHint();
}

function next() {
  if (busy || answered) return;
  if (revealing) { showAllLines(); return; }
  if (idx >= Q) return;
  turnForward(0);
}
function prev() { if (!busy && !answered) turnBack(); }

// ===== Lazo =====
async function untie() {
  if (!tied) return;
  tied = false;
  const bow = $("bow"), tT = $("tieT"), tB = $("tieB");
  bow.classList.remove("wiggle");
  const o = (d) => ({ duration: REDUCED ? 200 : d, easing: "cubic-bezier(.5,0,.3,1)", fill: "forwards" });
  if (bow.animate) {
    bow.animate([{ transform: getComputedStyle(bow).transform, opacity: 1 }, { transform: "translate(40px,-30px) rotate(35deg) scale(.4)", opacity: 0 }], o(700));
    tT.animate([{ transform: "translateY(0)", opacity: 1 }, { transform: "translateY(-105%)", opacity: 0 }], o(800));
    tB.animate([{ transform: "translateY(0)", opacity: 1 }, { transform: "translateY(105%)", opacity: 0 }], o(800));
  }
  await wait(REDUCED ? 200 : 650);
  [bow, tT, tB].forEach(el => el.style.display = "none");
}

// ===== Arrastrar la hoja con el dedo =====
let drag = null;
area.addEventListener("pointerdown", (e) => {
  initAudio();
  if (busy || answered || e.target.closest("button, a")) return;
  drag = { x: e.clientX, y: e.clientY, t: performance.now(), mode: null, p: 0, i: -1, lastX: e.clientX, lastT: performance.now(), v: 0 };
  try { area.setPointerCapture(e.pointerId); } catch (_) {}
});
area.addEventListener("pointermove", (e) => {
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  const now = performance.now();
  drag.v = (e.clientX - drag.lastX) / Math.max(1, now - drag.lastT);
  drag.lastX = e.clientX; drag.lastT = now;
  if (!drag.mode) {
    if (Math.abs(dx) < 10 || Math.abs(dx) < Math.abs(dy)) return;
    if (dx < 0 && idx < Q) {
      if (revealing) showAllLines();
      if (idx === 0 && tied) { untie(); }
      drag.mode = "fwd"; drag.i = idx;
    } else if (dx > 0 && idx > 0) {
      drag.mode = "back"; drag.i = idx - 1;
    } else { drag = null; return; }
    hideHint();
    arrange(drag.mode === "fwd" ? [drag.i, drag.i + 1] : [drag.i, drag.i - 1]);
    sheets[drag.i].style.zIndex = 400;
    book.classList.add("dragging");
    initAudio();
  }
  const w = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--pw"));
  const span = w * (spread ? 1.6 : 1.1);
  drag.p = drag.mode === "fwd" ? Math.min(1, Math.max(0, -dx / span)) : Math.min(1, Math.max(0, 1 - dx / span));
  driveSheet(drag.i, drag.p);
});
function endDrag(e) {
  if (!drag) return;
  const d = drag; drag = null;
  if (!d.mode) {
    // fue un toque
    const moved = Math.hypot(e.clientX - d.x, e.clientY - d.y);
    if (moved < 10 && e.type === "pointerup") next();
    return;
  }
  busy = true;
  if (d.mode === "fwd") {
    if (d.p > .3 || d.v < -.45) { busy = false; turnForward(d.p); }
    else settle(d.i, d.p, 0);
  } else {
    if (d.p < .7 || d.v > .45) { busy = false; turnBack(d.p); }
    else settle(d.i, d.p, 1);
  }
}
area.addEventListener("pointerup", endDrag);
area.addEventListener("pointercancel", endDrag);

$("next").addEventListener("click", (e) => { e.stopPropagation(); next(); });
$("prev").addEventListener("click", (e) => { e.stopPropagation(); prev(); });
document.addEventListener("keydown", (e) => {
  if (e.key === "ArrowRight" || e.key === " ") { e.preventDefault(); initAudio(); next(); }
  if (e.key === "ArrowLeft") prev();
});

// ===== Sonido de papel (se mezcla con la música, no la interrumpe) =====
let actx = null;
function initAudio() {
  if (!SOUND || actx) return;
  try {
    if (navigator.audioSession) navigator.audioSession.type = "ambient";
    actx = new (window.AudioContext || window.webkitAudioContext)();
  } catch (_) { actx = null; }
}
function playFlip() {
  if (!actx) return;
  try {
    if (actx.state === "suspended") actx.resume();
    // Hoja de papel: un roce crujiente hecho de muchos chasquidos diminutos
    // mientras la hoja se levanta, y un "flap" suave y grave cuando cae.
    const sr = actx.sampleRate, t = actx.currentTime, len = .62;
    const buf = actx.createBuffer(1, Math.floor(sr * len), sr);
    const d = buf.getChannelData(0);
    const env = (x) => x < .05 ? x / .05 : x < .16 ? 1 : Math.max(0, 1 - (x - .16) / .3);
    let burst = 0, burstAmp = 0;
    for (let i = 0; i < d.length; i++) {
      const x = i / sr, e = env(x);
      // chasquidos: ráfagas cortas de 1 a 5 ms, más densas cuando la hoja se mueve más
      if (burst <= 0 && Math.random() < e * 0.0035) { burst = Math.floor(sr * (.001 + Math.random() * .004)); burstAmp = .35 + Math.random() * .65; }
      let v = (Math.random() * 2 - 1) * .1 * e;
      if (burst > 0) { v += (Math.random() * 2 - 1) * burstAmp * e; burst--; }
      d[i] = v;
    }
    const src = actx.createBufferSource(); src.buffer = buf;
    const hp = actx.createBiquadFilter(); hp.type = "highpass"; hp.frequency.value = 1200;
    const lp = actx.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 6500;
    const pk = actx.createBiquadFilter(); pk.type = "peaking"; pk.frequency.value = 3200; pk.Q.value = 1; pk.gain.value = 4;
    const g = actx.createGain(); g.gain.value = .32;
    src.connect(hp); hp.connect(lp); lp.connect(pk); pk.connect(g); g.connect(actx.destination);
    src.start(t);

    // el "flap" final, muy suave
    const fl = actx.createBuffer(1, Math.floor(sr * .09), sr);
    const fd = fl.getChannelData(0);
    for (let i = 0; i < fd.length; i++) fd[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / fd.length, 3);
    const fs = actx.createBufferSource(); fs.buffer = fl;
    const flp = actx.createBiquadFilter(); flp.type = "lowpass"; flp.frequency.value = 520;
    const fg = actx.createGain(); fg.gain.value = .22;
    fs.connect(flp); flp.connect(fg); fg.connect(actx.destination);
    fs.start(t + .5);
  } catch (_) {}
}

// ===== La pregunta =====
const NO_TEXTS = [
  "No", "¿Segura?", "Piénsalo otra vez", "¿De verdad, de verdad?", "Mira qué grande está el Sí",
  "Ese botón no funciona", "Intenta con el otro", "¿Y si mejor sí?", "Error 404: «no» no encontrado",
  "Sigue intentando…", "Nop", "El Sí te está esperando"
];
const YES_MAX_STEP = 6;
let noCount = 0;
function qFace() { return sheets[Q].querySelector(".face.front"); }
function setNoGame(n) {
  noCount = n;
  const yes = $("yes"), no = $("no");
  const step = Math.min(n, YES_MAX_STEP);
  yes.style.fontSize = "min(" + (1.35 * (1 + step * 0.25)).toFixed(2) + "rem, 11cqi)";
  no.style.opacity = Math.max(.65, 1 - step * .06);
  no.textContent = n === 0 ? NO_TEXTS[0] : NO_TEXTS[1 + (n - 1) % (NO_TEXTS.length - 1)];
  if (n === 0) { no.classList.remove("loose"); no.style.left = ""; no.style.top = ""; }
}
function placeInside(x, y, w, h, pw, ph, pad) {
  const maxX = Math.max(pad, pw - w - pad), maxY = Math.max(pad, ph - h - pad);
  return [Math.min(Math.max(x, pad), maxX), Math.min(Math.max(y, pad), maxY)];
}
function dodge() {
  const no = $("no"), face = qFace(), page = face.getBoundingClientRect();
  if (!no.classList.contains("loose")) {
    const r0 = no.getBoundingClientRect();
    no.style.transition = "none";
    no.classList.add("loose");
    const cb0 = no.offsetParent.getBoundingClientRect();
    no.style.left = (r0.left - cb0.left) + "px"; no.style.top = (r0.top - cb0.top) + "px";
    void no.offsetWidth; no.style.transition = "";
  }
  const r = no.getBoundingClientRect();
  const avoid = [$("yes"), face.querySelector(".q"), face.querySelector(".lead"), face.querySelector(".popup")].filter(Boolean).map(el => el.getBoundingClientRect());
  const pad = 16, gap = 10;
  let best = null;
  for (let i = 0; i < 60; i++) {
    const [x, y] = placeInside(Math.random() * page.width, Math.random() * page.height, r.width, r.height, page.width, page.height, pad);
    const ax = page.left + x, ay = page.top + y;
    const hits = avoid.some(a => ax < a.right + gap && ax + r.width > a.left - gap && ay < a.bottom + gap && ay + r.height > a.top - gap);
    const close = Math.abs(ax - r.left) < 50 && Math.abs(ay - r.top) < 30;
    if (!hits && !close) { best = [x, y]; break; }
    if (!hits && !best) best = [x, y];
  }
  if (!best) best = placeInside(r.left - page.left, r.top - page.top, r.width, r.height, page.width, page.height, pad);
  const cb = no.offsetParent.getBoundingClientRect();
  no.style.left = Math.round(page.left + best[0] - cb.left) + "px";
  no.style.top = Math.round(page.top + best[1] - cb.top) + "px";
}

function wireSheetControls() {
  const bow = $("bow");
  if (bow) bow.addEventListener("click", (e) => { e.stopPropagation(); initAudio(); if (!busy) turnForward(0); });
  $("yes").addEventListener("click", (e) => { e.stopPropagation(); sayYes(); });
  $("no").addEventListener("click", (e) => {
    e.stopPropagation();
    setNoGame(noCount + 1);
    if (noCount > YES_MAX_STEP) dodge();
    const y = $("yes"); y.classList.remove("wiggle"); void y.offsetWidth; y.classList.add("wiggle");
  });
  $("again").addEventListener("click", (e) => { e.stopPropagation(); restart(); });
  if (noCount) setNoGame(noCount);
}

function dateParts() {
  const d = new Date();
  const m = ["ENE", "FEB", "MAR", "ABR", "MAY", "JUN", "JUL", "AGO", "SEP", "OCT", "NOV", "DIC"][d.getMonth()];
  return { day: d.getDate(), month: m, year: d.getFullYear() };
}
function stampSVG() {
  const { day, month, year } = dateParts();
  return '<svg viewBox="0 0 200 200" aria-label="Nuestra historia comenzó el ' + day + ' de ' + month.toLowerCase() + ' de ' + year + '">' +
    '<defs><path id="ring" d="M100 100 m-72 0 a72 72 0 1 1 144 0 a72 72 0 1 1 -144 0"/></defs>' +
    '<g fill="none" stroke="currentColor"><circle cx="100" cy="100" r="94" stroke-width="3"/><circle cx="100" cy="100" r="88" stroke-width="1"/><circle cx="100" cy="100" r="54" stroke-width="1.5"/></g>' +
    '<text font-size="14.5" letter-spacing="2.4"><textPath href="#ring" textLength="448">NUESTRA HISTORIA · COMENZÓ EL ·</textPath></text>' +
    '<text x="100" y="98" text-anchor="middle" font-size="40" font-style="italic">' + day + '</text>' +
    '<text x="100" y="122" text-anchor="middle" font-size="15" letter-spacing="3">' + month + ' ' + year + '</text>' +
    '<path transform="translate(92 130) scale(.7)" d="' + HEART.match(/d="([^"]+)"/)[1] + '" fill="currentColor"/>' +
    '</svg>';
}

async function sayYes() {
  if (answered) return;
  answered = true;
  hideHint();
  updateChrome();
  const face = qFace();
  const ask = face.querySelector(".ask"), pop = face.querySelector(".popup");
  hearts();
  const fade = (el) => el && el.animate ? el.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 500, fill: "forwards" }).finished : Promise.resolve();
  await Promise.all([fade(ask), fade(pop)]);
  ask.hidden = true; if (pop) pop.style.display = "none";
  const ans = $("answer");
  $("stamp").innerHTML = stampSVG();
  ans.hidden = false;
  fitAll();
  const big = ans.querySelector(".big"), love = $("love"), stamp = $("stamp"), again = $("again");
  if (big.animate) big.animate([{ opacity: 0, transform: "translateY(14px)" }, { opacity: 1, transform: "none" }], { duration: 1000, fill: "backwards" });
  await wait(1000);
  if (love.animate) await love.animate([{ opacity: 0, transform: "scale(.7)" }, { opacity: 1, transform: "scale(1)" }], { duration: 1300, easing: "cubic-bezier(.25,.6,.3,1)", fill: "forwards" }).finished;
  love.style.opacity = 1; love.classList.add("on");
  await wait(500);
  if (stamp.animate) await stamp.animate(REDUCED ? [{ opacity: 0 }, { opacity: .9 }] : [
    { opacity: 0, transform: "scale(1.9) rotate(-28deg)" },
    { opacity: .95, transform: "scale(.94) rotate(-12deg)", offset: .7 },
    { opacity: .9, transform: "scale(1) rotate(-12deg)" }
  ], { duration: 650, easing: "cubic-bezier(.5,0,.75,0)", fill: "forwards" }).finished;
  if (!REDUCED && face.animate) face.animate([{ transform: "translate(0,0)" }, { transform: "translate(0,2px)" }, { transform: "translate(0,0)" }], { duration: 160 });
  playFlip();
  await wait(900);
  if (again.animate) again.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 700, fill: "forwards" });
}

async function restart() {
  answered = false; tied = true; noCount = 0; idx = 0; busy = false;
  clearTimers(); hideHint();
  const area_ = area;
  if (area_.animate) await area_.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 400, fill: "forwards" }).finished;
  build();
  if (area_.animate) area_.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 600, fill: "forwards" });
}

// ===== Corazones =====
const cv = $("fx"), ctx = cv.getContext("2d");
function size() { cv.width = innerWidth * devicePixelRatio; cv.height = innerHeight * devicePixelRatio; }
size();
function heartPath(x, y, s) {
  ctx.beginPath();
  ctx.moveTo(x, y + s * 0.3);
  ctx.bezierCurveTo(x, y, x - s / 2, y, x - s / 2, y + s * 0.3);
  ctx.bezierCurveTo(x - s / 2, y + s * 0.6, x, y + s * 0.8, x, y + s);
  ctx.bezierCurveTo(x, y + s * 0.8, x + s / 2, y + s * 0.6, x + s / 2, y + s * 0.3);
  ctx.bezierCurveTo(x + s / 2, y, x, y, x, y + s * 0.3);
  ctx.fill();
}
function hearts() {
  if (REDUCED) return;
  const d = devicePixelRatio, colors = ["#e8a0a8", "#c96b7b", "#f3e9e4", "#e48a98"];
  const ps = Array.from({ length: 90 }, () => ({
    x: Math.random() * cv.width, y: cv.height + Math.random() * cv.height * 0.6,
    s: (10 + Math.random() * 22) * d, v: (1.2 + Math.random() * 2.4) * d,
    w: Math.random() * Math.PI * 2, c: colors[(Math.random() * colors.length) | 0], a: 0.5 + Math.random() * 0.5
  }));
  const start = performance.now();
  (function frame(t) {
    ctx.clearRect(0, 0, cv.width, cv.height);
    const fade = Math.max(0, 1 - (t - start - 7000) / 2500);
    ps.forEach(p => {
      p.y -= p.v; p.w += 0.03; p.x += Math.sin(p.w) * 0.8 * d;
      if (p.y < -p.s && t - start < 7000) p.y = cv.height + p.s;
      ctx.globalAlpha = p.a * fade; ctx.fillStyle = p.c; heartPath(p.x, p.y, p.s);
    });
    if (fade > 0) requestAnimationFrame(frame); else ctx.clearRect(0, 0, cv.width, cv.height);
  })(start);
}

let rz;
addEventListener("resize", () => { size(); clearTimeout(rz); rz = setTimeout(layout, 150); });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => fitAll());
layout();
</script>
