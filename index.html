<style>
/* Layout: tres tarjetas de papel sobre la misma noche de los tres capítulos; en vertical se apilan, en horizontal van en fila. Tema nocturno fijo, a propósito. */
:root {
  --night: #17121f;
  --night-2: #241b30;
  --muted: #b9a7b4;
  --rose: #e8a0a8;
  --paper: #f8eeea;
  --ink: #3b2536;
  --ink-soft: #7a5e6f;
  --accent: #b8566a;
  --font-display: "Fraunces", "Georgia", serif;
  --font-body: "Newsreader", "Georgia", serif;
  --font-hand: "Caveat", "Segoe Script", cursive;
  color-scheme: dark;
}
html, body { min-height: 100%; }
body {
  background:
    radial-gradient(ellipse 70% 45% at 50% 30%, rgba(232,160,168,.14), transparent 70%),
    radial-gradient(ellipse 120% 80% at 50% 120%, var(--night-2), transparent 60%),
    var(--night);
  background-attachment: fixed;
  color: var(--rose);
  font-family: var(--font-body);
  -webkit-tap-highlight-color: transparent;
}
#app {
  box-sizing: border-box;
  min-height: 100vh; min-height: 100dvh;
  display: grid; align-content: center; justify-items: center;
  gap: clamp(22px, 4vh, 44px);
  padding-left: max(18px, env(safe-area-inset-left, 0px));
  padding-right: max(18px, env(safe-area-inset-right, 0px));
  padding-block: clamp(28px, 6vh, 64px);
}
header { display: grid; justify-items: center; text-align: center; gap: .25rem; }
.k { font-size: clamp(.72rem, .6rem + .4vw, .95rem); letter-spacing: .3em; text-transform: uppercase; color: var(--muted); }
.sub { margin: .35rem 0 0; font-family: var(--font-display); font-style: italic; font-weight: 300; font-size: clamp(1.05rem, .9rem + .7vw, 1.45rem); color: var(--rose); opacity: .9; text-wrap: balance; }
h1 { margin: 0; font-family: var(--font-hand); font-weight: 700; font-size: clamp(3rem, 2rem + 4vw, 5rem); line-height: 1; color: var(--rose); }

.cards { list-style: none; margin: 0; padding: 0; width: min(100%, 980px); display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: clamp(14px, 2.4vw, 24px); }
.cards li { display: grid; }
.card {
  position: relative; display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 16px;
  padding: 18px 18px 18px 16px; border-radius: 16px; text-decoration: none; color: var(--ink);
  background: radial-gradient(ellipse at 80% 0%, rgba(255,255,255,.7), transparent 55%), var(--paper);
  box-shadow: 0 18px 40px rgba(0,0,0,.4);
  transition: transform 250ms ease, box-shadow 250ms ease;
  opacity: 0; animation: rise 800ms cubic-bezier(.25,.6,.3,1) forwards;
}
.cards li:nth-child(2) .card { animation-delay: 140ms; }
.cards li:nth-child(3) .card { animation-delay: 280ms; }
@keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
.card:hover, .card:focus-visible { transform: translateY(-3px); box-shadow: 0 24px 50px rgba(0,0,0,.5); }
.card:focus { outline: none; }
.card:focus-visible { outline: 2px solid var(--rose); outline-offset: 4px; }
.card:active { transform: scale(.98); }
.pic { width: 64px; height: 64px; border-radius: 14px; display: grid; place-items: center; background: rgba(184,86,106,.1); }
.pic svg { width: 46px; height: 46px; fill: none; stroke: var(--accent); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.pic svg .f { fill: var(--accent); stroke: none; }
.txt { display: grid; gap: 2px; min-width: 0; }
.num { font-size: .72rem; letter-spacing: .24em; text-transform: uppercase; color: var(--ink-soft); }
.name { font-family: var(--font-hand); font-weight: 700; font-size: 2rem; line-height: 1; color: var(--accent); }
.desc { font-size: .98rem; color: var(--ink-soft); line-height: 1.35; }
.go { font-size: 1.5rem; color: var(--accent); opacity: .7; }

/* En pantallas anchas las tarjetas se vuelven verticales, una al lado de la otra */
@media (min-width: 760px) {
  .card { grid-template-columns: 1fr; justify-items: center; text-align: center; padding: 30px 22px 26px; gap: 14px; }
  .pic { width: 110px; height: 110px; border-radius: 22px; }
  .pic svg { width: 76px; height: 76px; }
  .name { font-size: 2.4rem; }
  .go { display: none; }
}
@media (prefers-reduced-motion: reduce) { .card { animation: none; opacity: 1; } }
</style>
